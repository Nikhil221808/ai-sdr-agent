[project]
name = "ai-sdr-agent"
version = "0.1.0"
description = "Researches an account, writes a grounded cold email, grades it, and revises until it passes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.10",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sdr-agent = "sdr_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sdr_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
